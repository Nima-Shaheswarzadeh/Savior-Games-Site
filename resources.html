<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>منابع — Monji Games</title>
  <meta name="description" content="منابع منجی: گندم، چوب، سنگ، آهن، نقره و یاقوت — پایه‌های یک اقتصاد قوی.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="resources" data-title-key="pg.resources">
  <div id="siteHeader"></div>

  <main id="main">
    <!-- hero -->
    <section class="page-hero">
      <div class="ph-bg"><img src="images/hero-resources.jpg" alt=""></div>
      <div class="container">
        <div class="hero-copy hero-copy--end">
          <h1 class="hero-title" data-i18n="res.heroTitle"></h1>
          <p class="hero-sub" data-i18n="res.heroSub"></p>
          <p class="hero-para" data-i18n="res.heroPara"></p>
        </div>
      </div>
    </section>

    <!-- resource cards -->
    <section class="section-sm">
      <div class="container">
        <div style="margin-bottom:22px;display:flex;justify-content:flex-end">
          <a class="btn btn-gold btn-sm" href="city.html" data-i18n="res.build"></a>
        </div>
        <div class="res-grid" id="resourceGrid"></div>

        <!-- callout -->
        <div class="callout reveal">
          <div class="co-bg"><img src="images/army-defense.jpg" alt="" loading="lazy"></div>
          <div class="co-icon" aria-hidden="true"></div>
          <div class="co-text">
            <h3 data-i18n="res.calloutTitle"></h3>
            <p>
              <span data-i18n="res.callout1"></span><br>
              <span data-i18n="res.callout2"></span><br>
              <span data-i18n="res.callout3"></span>
            </p>
          </div>
        </div>
      </div>
    </section>

    <section class="quote-banner">
      <div class="container">
        <div class="ornament reveal" aria-hidden="true"></div>
        <p class="q-text reveal" data-i18n="quote.text"></p>
        <p class="q-en reveal" data-i18n="quote.en"></p>
      </div>
    </section>
  </main>

  <div id="siteFooter"></div>
  <div id="modals"></div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data-fallback.js"></script>
  <script>window.MJ_CONFIG = { apiUrl: '' };</script>
  <script src="assets/js/main.js"></script>
</body>
</html>
