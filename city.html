<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>شهر و ساختمان‌ها — Monji Games</title>
  <meta name="description" content="شهر منجی: ساختمان‌های حکومتی، نظامی، اقتصادی و دفاعی. هر ساختمان، بخشی از قدرت حکومت توست.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="city" data-title-key="pg.city">
  <div id="siteHeader"></div>

  <main id="main">
    <!-- per-tab hero -->
    <section class="page-hero" id="cityHero">
      <div class="ph-bg"><img src="images/hero-city.jpg" alt=""></div>
      <div class="container">
        <div class="hero-copy">
          <h1 class="hero-title" data-hero-title></h1>
          <p class="hero-sub" data-hero-sub></p>
          <p class="hero-para" data-hero-para></p>
        </div>
      </div>
    </section>

    <div id="cityContent" class="container">
      <!-- tabs -->
      <section class="section-sm">
        <div class="tabs-row" id="cityTabs" role="tablist" aria-label="Monji city categories"></div>
      </section>

      <!-- buildings + level band -->
      <section class="section-sm">
        <div id="buildingsGrid" class="buildings-grid"></div>
        <div class="level-band" id="cityLevel"></div>
      </section>
    </div>
  </main>

  <div id="siteFooter"></div>
  <div id="modals"></div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data-fallback.js"></script>
  <script>window.MJ_CONFIG = { apiUrl: '' };</script>
  <script src="assets/js/main.js"></script>
</body>
</html>
