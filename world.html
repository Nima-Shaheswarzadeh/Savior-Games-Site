<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>جهان بازی — Monji Games</title>
  <meta name="description" content="جهان منجی: سرزمینی زنده از شهرها، اتحادها، جنگ‌ها و تجارت — در انتظار تصمیم‌های تو.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="world" data-title-key="pg.world">
  <div id="siteHeader"></div>

  <main id="main">
    <!-- hero -->
    <section class="page-hero page-hero--tall">
      <div class="ph-bg"><img src="images/hero-world.jpg" alt=""></div>
      <div class="container">
        <div class="hero-copy">
          <p class="eyebrow" data-i18n="world.eyebrow"></p>
          <h1 class="hero-title" data-i18n="world.title"></h1>
          <p class="hero-sub" data-i18n="world.sub"></p>
          <p class="hero-para" data-i18n="world.para"></p>
        </div>
      </div>
      <p class="hero-quotebox" data-i18n="world.quote"></p>
    </section>

    <!-- world cards -->
    <section class="section">
      <div class="container">
        <div class="sec-head reveal">
          <div class="ornament" aria-hidden="true"></div>
          <h2 class="sec-title" data-i18n="world.secTitle"></h2>
        </div>
        <div class="world-grid" id="worldCards"></div>
      </div>
    </section>

    <section class="quote-banner">
      <div class="container">
        <div class="ornament reveal" aria-hidden="true"></div>
        <p class="q-text reveal" data-i18n="quote.text"></p>
        <p class="q-en reveal" data-i18n="quote.en"></p>
      </div>
    </section>
  </main>

  <div id="siteFooter"></div>
  <div id="modals"></div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data-fallback.js"></script>
  <script>window.MJ_CONFIG = { apiUrl: '' };</script>
  <script src="assets/js/main.js"></script>
</body>
</html>
